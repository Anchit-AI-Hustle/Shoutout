name: CI

# Pipeline order per docs/15-TESTING.md (seventh draft):
# lint -> typecheck -> unit -> test:boundaries -> test:rls -> test:money -> build -> test:e2e @critical -> deploy
# test:boundaries replaces the old test:registry (retired with the
# polymorphic Shout object, migration 008) — it now checks module boundary
# conformance instead of registry type-branching. Still a stub; real modules/
# and packages/discovery don't exist yet. test:money is also still a stub.
# Neither may be removed from this order.
#
# test:rls (B2, docs/10-TESTING.md Gate 1) needs a SUPABASE_DB_URL repo secret:
# a direct Postgres connection string using the `postgres` role (bypasses RLS
# for seeding test fixtures — this is test infrastructure, not a production
# request path). Settings → Secrets and variables → Actions → New repository
# secret. Without it this step fails closed, which is correct: an RLS gate
# that silently skips is worse than no gate at all.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:boundaries
      - run: pnpm test:rls
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - run: pnpm test:money
      - run: pnpm build
      # test:e2e (@critical) enabled once Playwright specs exist — see docs/10-TESTING.md Gate 3
